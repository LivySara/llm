        - heading "Transformer 架构详解——从自注意力到完整解码器" [level=1] [ref=e17]
        - paragraph [ref=e18]:
          - text: 2017 年之前，处理序列数据的主流架构是 RNN 和 LSTM。它们在机器翻译、语音识别等任务上统治了近十年，但有一个结构性的硬伤：
          - strong [ref=e19]: 第 t 个 token 必须等第 t-1 个算完才能开始
          - text: 。这个串行依赖带来了两个无法绕过的问题——序列越长训练越慢（GPU 的并行能力被浪费），以及跨长距离的信息会随着梯度传播逐步衰减甚至消失。
        - paragraph [ref=e20]:
          - text: 同年，Vaswani 等人的《Attention Is All You Need》用
          - strong [ref=e21]: 自注意力（Self-Attention）
          - text: 一次性解决了这两个问题：每个 token 直接关注序列中所有其他 token，没有先后顺序，只有相关度权重。这个简单的想法催生了 Transformer 架构，进而演化为今天所有大语言模型（GPT、LLaMA、Qwen、DeepSeek、Claude）的共同基础。
        - paragraph [ref=e22]: 但切换到全并行架构并非没有代价。去掉串行顺序意味着位置信息丢失——要让模型区分「我打你」和「你打我」，靠权重表是不够的。同时，全注意力在长序列上的计算量是 O(n²)，当上下文从 2K 扩展到 128K 时，这个代价变得不可忽视。
        - paragraph [ref=e23]:
          - text: 本文从零拆解 Transformer 的核心组件。阅读目标是：
          - strong [ref=e24]:
            - text: 读完能看懂一份
            - code [ref=e25]: modeling_llama.py
            - text: 级别的源码
          - text: ，并理解每个组件解决了什么问题、又带来了什么新问题。
        - separator [ref=e26]: ◆
