        - heading "❯ 五、位置编码：解决注意力「看不到顺序」的问题" [level=2] [ref=e943]
        - paragraph [ref=e944]:
          - text: 自注意力有一个根本性的盲区：
          - strong [ref=e945]: 它对 token 的位置完全不敏感。
          - text: 打乱整个输入序列，计算出的注意力分数不变。
        - paragraph [ref=e946]: 但语言是有严格顺序的。「我打你」和「你打我」共享完全相同的 token 集合，含义却相反。RNN 通过串行计算自然地捕获了顺序——Transformer 的并行注意力牺牲了这一点。因此必须通过额外的机制向模型注入位置信息。
        - heading "## 5.1 两种注入策略" [level=3] [ref=e947]
        - paragraph [ref=e948]:
          - strong [ref=e949]: 加到输入端
          - text: ：将位置编码 p_i 直接加到 token embedding x_i 上——input_i = x_i + p_i。原始 Transformer 使用固定的正弦/余弦函数生成 p_i，GPT-2/3 则用可学习的 Embedding 表。
        - paragraph [ref=e950]:
          - strong [ref=e951]: 融入注意力计算
          - text: ：不修改 token 表示本身，而是根据位置对 Q 和 K 施加旋转变换。RoPE（旋转位置编码）是这一策略的代表——它将位置信息编码为 Q·K 点积中的相对位置项，天然支持比训练时更长的上下文。
        - blockquote [ref=e952]:
          - paragraph [ref=e953]:
            - text: 详见本目录的
            - link "位置编码：从 Sinusoidal 到 RoPE" [ref=e954] [cursor=pointer]:
              - /url: /06_llm_theory_and_fundamentals/llm_basic_concepts/positional_encoding/positional_encoding.html
            - text: 对 RoPE 数学原理与 NTK/YaRN 外推技术的完整推导。
        - separator [ref=e955]: ◆
